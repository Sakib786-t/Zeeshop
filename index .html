<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeeShop - E-commerce Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        header {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            width: 90%;
            margin: 20px auto;
        }
        .product {
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 15px;
            margin: 15px;
            text-align: center;
        }
        .product img {
            width: 100%;
            max-width: 250px;
            height: auto;
        }
        .product h3 {
            font-size: 20px;
            margin: 10px 0;
        }
        .product p {
            font-size: 16px;
            color: #333;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .buttons button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .buttons button:hover {
            background-color: #218838;
        }
        footer {
            margin-top: 20px;
            text-align: center;
            padding: 10px;
            background-color: #333;
            color: white;
        }
        a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body><header>
    <h1>Welcome to ZeeShop 
by sakib</h1>
    <p>Your one-stop shop for trendy clothes</p>
</header><div class="container">
    <div class="product">
        <img src="https://via.placeholder.com/250" alt="Shirt">
        <h3>Stylish Shirt</h3>
        <p>Price: ₹450</p>
        <div class="buttons">
            <button>Add to Cart</button>
            <button>Order Now</button>
        </div>
    </div><div class="product">
    <img src="https://via.placeholder.com/250" alt="T-Shirt">
    <h3>Casual T-Shirt</h3>
    <p>Price: ₹350</p>
    <div class="buttons">
        <button>Add to Cart</button>
        <button>Order Now</button>
    </div>
</div>

<div class="product">
    <img src="https://via.placeholder.com/250" alt="Kurta">
    <h3>Elegant Kurta</h3>
    <p>Price: ₹650</p>
    <div class="buttons">
        <button>Add to Cart</button>
        <button>Order Now</button>
    </div>
</div>

<div class="product">
    <img src="https://via.placeholder.com/250" alt="Pajama">
    <h3>Comfortable Pajama</h3>
    <p>Price: ₹300</p>
    <div class="buttons">
        <button>Add to Cart</button>
        <button>Order Now</button>
    </div>
</div>

</div><footer>
    <p>Created by Sakib and Shahjahan | &copy; 2025 ZeeShop</p>
</footer></body>
</html>
